<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      padding: 20px;
      margin: 0;
    }
    
    h2 {
      margin-top: 0;
      color: #333;
    }
    
    .auth-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .info {
      background: #f0f0f0;
      padding: 15px;
      border-radius: 8px;
      font-size: 14px;
      color: #666;
    }
    
    button {
      padding: 12px 24px;
      font-size: 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s;
    }
    
    #authenticate {
      background: #18A0FB;
      color: white;
    }
    
    #authenticate:hover {
      background: #1590E8;
    }
    
    #authenticate:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
    
    #cancel {
      background: #f0f0f0;
      color: #333;
    }
    
    #cancel:hover {
      background: #e0e0e0;
    }
    
    .status {
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      display: none;
    }
    
    .status.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    
    .status.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    
    .status.loading {
      background: #d1ecf1;
      color: #0c5460;
      display: block;
    }
    
    iframe {
      width: 100%;
      height: 300px;
      border: 1px solid #ddd;
      border-radius: 6px;
      display: none;
    }

    .user-data {
      display: none;
      background: #e8f5e9;
      border: 1px solid #4caf50;
      border-radius: 8px;
      padding: 15px;
      margin-top: 10px;
    }

    .user-data.show {
      display: block;
    }

    .user-data h3 {
      margin: 0 0 10px 0;
      color: #2e7d32;
      font-size: 16px;
    }

    .user-data pre {
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      margin: 5px 0;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user-data label {
      font-weight: 600;
      color: #555;
      display: block;
      margin-top: 10px;
      margin-bottom: 5px;
    }
  </style>
</head>
<body>
  <div class="auth-container">
    <h2>Authentication</h2>
    
    <div class="info">
      This plugin uses OAuth authentication. Clicking "Authenticate" will redirect to a secure authentication page.
    </div>
    
    <div id="status" class="status"></div>

    <div id="user-data" class="user-data">
      <h3>✅ User Data</h3>
      <label>Custom Token:</label>
      <pre id="token-display"></pre>
      <label>Token Preview (first 50 chars):</label>
      <pre id="token-preview"></pre>
    </div>
    
    <iframe id="auth-iframe" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox"></iframe>
    
    <button id="authenticate">Authenticate</button>
    <button id="cancel">Cancel</button>
  </div>

  <script>
    // Firebase + endpoints configuration
    const FIREBASE_AUTH_URL = 'http://127.0.0.1:5000/'; // Local hosting (index.html)
    const FUNCTIONS_BASE = 'http://127.0.0.1:5001/my-auth-figma/us-central1'; // Local Functions emulator

    // Firebase Web SDK (only Firestore needed here)
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script>
    // Public config (safe to embed)
    const firebaseConfig = {
      apiKey: "AIzaSyBXCZ_34epRlVsD1_2GWPAq0A-lG49WogM",
      authDomain: "my-auth-figma.firebaseapp.com",
      projectId: "my-auth-figma",
      storageBucket: "my-auth-figma.firebasestorage.app",
      messagingSenderId: "832872984394",
      appId: "1:832872984394:web:c24c5efccae3753bbc9bb3"
    };
    firebase.initializeApp(firebaseConfig);
    // Use Firestore emulator locally
    if (typeof firebase !== 'undefined' && firebase.firestore) {
      try { firebase.firestore().useEmulator('127.0.0.1', 8081); } catch (e) {}
    }
    
    const authenticateBtn = document.getElementById('authenticate');
    const cancelBtn = document.getElementById('cancel');
    const statusDiv = document.getElementById('status');
    const authIframe = document.getElementById('auth-iframe');
    
    let currentAccessToken = null;
    let pollInterval = null;
    
    // Show status message
    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = 'status ' + type;
    }
    
    // Generate unique session ID for this auth attempt
    function generateSessionId() {
      return 'figma_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
    }
    
    // Poll Firestore for the custom token using SDK
    async function pollFirestoreForToken(sessionId) {
      try {
        const db = firebase.firestore();
        const docRef = db.collection('figma_auth').doc(sessionId);
        const snap = await docRef.get();
        if (!snap.exists) return null;

        const data = snap.data() || {};
        const customToken = data.customToken;
        if (customToken) {
          // Cleanup: best-effort delete
          docRef.delete().catch(err => console.error('Failed to delete session doc:', err));
          return customToken;
        }
        return null;
      } catch (error) {
        console.error('Firestore polling error:', error);
        return null;
      }
    }
    
    // Handle authentication button click
    authenticateBtn.onclick = async () => {
      authenticateBtn.disabled = true;
      showStatus('Initializing authentication...', 'loading');
      
      try {
        // Request a server-generated session ID (single-use)
        showStatus('Requesting secure session...', 'loading');
        const sessResp = await fetch(`${FUNCTIONS_BASE}/createAuthSession`, { method: 'POST' });
        if (!sessResp.ok) throw new Error(`Failed to create session (${sessResp.status})`);
        const sessData = await sessResp.json();
        const sessionId = sessData.sessionId;
        if (!sessionId) throw new Error('No sessionId returned');

        // Build auth URL with server session ID
        const authUrl = `${FIREBASE_AUTH_URL}?sessionId=${encodeURIComponent(sessionId)}`;
        
        // Open Firebase auth page in browser
        parent.postMessage({ 
          pluginMessage: { 
            type: 'open-auth-url', 
            url: authUrl 
          } 
        }, '*');
        
        showStatus('Please sign in with your browser...', 'loading');
        
        // Start polling Firestore for the custom token
        let attempts = 0;
        const maxAttempts = 120; // 2 minutes with 1 second intervals
        
        pollInterval = setInterval(async () => {
          attempts++;
          
          const customToken = await pollFirestoreForToken(sessionId);
          
          if (customToken) {
            clearInterval(pollInterval);
            currentAccessToken = customToken;
            showStatus('Authentication successful!', 'success');
            authenticateBtn.disabled = false;
            authenticateBtn.textContent = 'Re-authenticate';

            // Display token in UI
            console.log('🎫 Custom Token received:', customToken);
            document.getElementById('token-display').textContent = customToken;
            document.getElementById('token-preview').textContent = customToken.substring(0, 50) + '...';
            document.getElementById('user-data').classList.add('show');
            
            // Save token to plugin storage
            parent.postMessage({ 
              pluginMessage: { 
                type: 'save-token', 
                token: customToken 
              } 
            }, '*');
          } else if (attempts >= maxAttempts) {
            clearInterval(pollInterval);
            showStatus('Authentication timed out. Please try again.', 'error');
            authenticateBtn.disabled = false;
          }
        }, 1000);
        
      } catch (error) {
        console.error('Authentication error:', error);
        showStatus('Authentication failed: ' + error.message, 'error');
        authenticateBtn.disabled = false;
      }
    };
    
    // Listen for messages from plugin main code
    window.addEventListener('message', (event) => {
      const msg = event.data.pluginMessage;
      
      if (msg?.type === 'existing-token') {
        // Plugin sent us an existing token
        if (msg.token) {
          currentAccessToken = msg.token;
          showStatus('Already authenticated', 'success');
          authenticateBtn.textContent = 'Re-authenticate';
          
          // Display existing token
          console.log('🎫 Existing Token loaded:', msg.token);
          document.getElementById('token-display').textContent = msg.token;
          document.getElementById('token-preview').textContent = msg.token.substring(0, 50) + '...';
          document.getElementById('user-data').classList.add('show');
        }
      }
      
      if (msg?.type === 'token-saved') {
        // Token was successfully saved
        console.log('Token saved successfully');
      }
    });
    
    // Cancel button
    cancelBtn.onclick = () => {
      if (pollInterval) {
        clearInterval(pollInterval);
      }
      parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*');
    };
  </script>
</body>
</html>
